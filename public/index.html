<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Viajes ✈️</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
      padding: 2.5rem 1rem;
      text-align: center;
      border-bottom: 1px solid #1e40af44;
    }

    header h1 { font-size: 2.2rem; font-weight: 800; color: #60a5fa; letter-spacing: -0.5px; }
    header p  { color: #94a3b8; margin-top: 0.4rem; font-size: 1rem; }

    main { max-width: 860px; margin: 0 auto; padding: 2rem 1rem 4rem; }

    /* ── FORM ── */
    .form-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2rem;
      margin-bottom: 2.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group.full { grid-column: 1 / -1; }

    label { font-size: 0.8rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }

    input, select {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      color: #e2e8f0;
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      transition: border-color .2s;
      width: 100%;
    }
    input:focus, select:focus { outline: none; border-color: #3b82f6; }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.2rem;
    }

    .chip-label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 2rem;
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all .2s;
      user-select: none;
    }
    .chip-label input[type="checkbox"] { display: none; }
    .chip-label:hover { border-color: #3b82f6; color: #60a5fa; }
    .chip-label.selected { background: #1d4ed8; border-color: #3b82f6; color: #fff; }

    button[type="submit"] {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.85rem;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 0.6rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    button[type="submit"]:hover  { opacity: 0.9; }
    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── LOADER ── */
    #loader {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2rem;
      color: #94a3b8;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #1e293b;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ERROR ── */
    #error-box {
      display: none;
      background: #450a0a;
      border: 1px solid #b91c1c;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      color: #fca5a5;
      margin-bottom: 1.5rem;
    }

    /* ── RESULTS ── */
    #results { display: none; }

    .results-header { margin-bottom: 1.5rem; }
    .results-header h2 { font-size: 1.6rem; font-weight: 800; color: #60a5fa; }
    .budget-tip {
      background: #1e293b;
      border-left: 3px solid #f59e0b;
      border-radius: 0 0.5rem 0.5rem 0;
      padding: 0.75rem 1rem;
      color: #fcd34d;
      font-size: 0.9rem;
      margin-top: 0.75rem;
    }

    /* day card */
    .day-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .day-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: linear-gradient(90deg, #1d3461 0%, #1e293b 100%);
      border-bottom: 1px solid #334155;
      cursor: pointer;
    }
    .day-badge {
      background: #2563eb;
      color: #fff;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 0.25rem 0.7rem;
      border-radius: 2rem;
      white-space: nowrap;
    }
    .day-header h3 { font-size: 1rem; font-weight: 700; color: #e2e8f0; flex: 1; }
    .chevron { color: #64748b; transition: transform .3s; font-size: 1rem; }
    .day-card.open .chevron { transform: rotate(180deg); }

    .day-body { padding: 1rem 1.25rem 1.25rem; }

    /* activity */
    .activity {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 0.5rem 1rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid #1e293b;
    }
    .activity:last-child { border-bottom: none; }

    .momento {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.3rem 0;
      color: #64748b;
    }
    .manana  { color: #fbbf24; }
    .tarde   { color: #fb923c; }
    .noche   { color: #818cf8; }

    .activity-content h4 { font-size: 0.95rem; font-weight: 700; color: #e2e8f0; margin-bottom: 0.25rem; }
    .activity-content p  { font-size: 0.85rem; color: #94a3b8; line-height: 1.5; }
    .maps-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.45rem;
      font-size: 0.78rem;
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
    }
    .maps-link:hover { color: #60a5fa; }

    /* rain alternative */
    .rain-card {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      background: #0f172a;
      border: 1px dashed #334155;
      border-radius: 0.6rem;
      padding: 0.85rem 1rem;
      margin-top: 0.85rem;
    }
    .rain-icon { font-size: 1.4rem; flex-shrink: 0; }
    .rain-card h5 { font-size: 0.85rem; font-weight: 700; color: #7dd3fc; margin-bottom: 0.2rem; }
    .rain-card p  { font-size: 0.82rem; color: #64748b; line-height: 1.45; }

    /* tips */
    .tips-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 1.25rem;
    }
    .tips-card h3 { font-size: 1rem; font-weight: 700; color: #a78bfa; margin-bottom: 0.75rem; }
    .tips-card ul { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .tips-card li {
      display: flex; gap: 0.6rem; align-items: flex-start;
      font-size: 0.88rem; color: #94a3b8; line-height: 1.5;
    }
    .tips-card li::before { content: "→"; color: #a78bfa; flex-shrink: 0; }

    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
      .activity  { grid-template-columns: 60px 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>✈️ App Viajes</h1>
  <p>Genera tu itinerario personalizado con inteligencia artificial</p>
</header>

<main>
  <div class="form-card">
    <form id="travel-form">
      <div class="form-grid">

        <div class="form-group">
          <label for="destino">Destino</label>
          <input id="destino" type="text" placeholder="Ej: Tokyo, Japón" required />
        </div>

        <div class="form-group">
          <label for="dias">Número de días</label>
          <input id="dias" type="number" min="1" max="14" placeholder="Ej: 5" required />
        </div>

        <div class="form-group">
          <label for="tipo_viaje">Tipo de viaje</label>
          <select id="tipo_viaje" required>
            <option value="">Selecciona…</option>
            <option value="solo">Solo</option>
            <option value="pareja">En pareja</option>
            <option value="familia">En familia</option>
            <option value="amigos">Con amigos</option>
          </select>
        </div>

        <div class="form-group">
          <label for="presupuesto">Presupuesto</label>
          <select id="presupuesto" required>
            <option value="">Selecciona…</option>
            <option value="bajo">Bajo 🪙</option>
            <option value="medio">Medio 💰</option>
            <option value="alto">Alto 💎</option>
          </select>
        </div>

        <div class="form-group full">
          <label>Intereses</label>
          <div class="checkbox-group" id="intereses-group">
            <label class="chip-label"><input type="checkbox" value="gastronomia" />🍜 Gastronomía</label>
            <label class="chip-label"><input type="checkbox" value="cultura" />🏛️ Cultura</label>
            <label class="chip-label"><input type="checkbox" value="naturaleza" />🌿 Naturaleza</label>
            <label class="chip-label"><input type="checkbox" value="aventura" />🧗 Aventura</label>
            <label class="chip-label"><input type="checkbox" value="compras" />🛍️ Compras</label>
            <label class="chip-label"><input type="checkbox" value="historia" />📜 Historia</label>
            <label class="chip-label"><input type="checkbox" value="arte" />🎨 Arte</label>
            <label class="chip-label"><input type="checkbox" value="playas" />🏖️ Playas</label>
            <label class="chip-label"><input type="checkbox" value="vida_nocturna" />🎶 Vida nocturna</label>
          </div>
        </div>

      </div>
      <button type="submit" id="submit-btn">Generar itinerario ✨</button>
    </form>
  </div>

  <div id="error-box"></div>

  <div id="loader">
    <div class="spinner"></div>
    <span>La IA está diseñando tu viaje…</span>
  </div>

  <div id="results"></div>
</main>

<script>
  // chip toggle
  document.querySelectorAll('.chip-label').forEach(label => {
    label.addEventListener('click', () => {
      label.classList.toggle('selected', label.querySelector('input').checked);
    });
    // sync on page load in case browser restores state
    label.querySelector('input').addEventListener('change', e => {
      label.classList.toggle('selected', e.target.checked);
    });
  });

  // collapsible day cards
  document.addEventListener('click', e => {
    const header = e.target.closest('.day-header');
    if (!header) return;
    header.closest('.day-card').classList.toggle('open');
  });

  // form submit
  document.getElementById('travel-form').addEventListener('submit', async e => {
    e.preventDefault();

    const intereses = [...document.querySelectorAll('#intereses-group input:checked')]
      .map(cb => cb.value);

    if (intereses.length === 0) {
      showError('Selecciona al menos un interés.');
      return;
    }

    const payload = {
      destino:     document.getElementById('destino').value.trim(),
      dias:        parseInt(document.getElementById('dias').value, 10),
      tipo_viaje:  document.getElementById('tipo_viaje').value,
      presupuesto: document.getElementById('presupuesto').value,
      intereses,
    };

    setLoading(true);
    clearError();
    document.getElementById('results').style.display = 'none';

    try {
      const res = await fetch('/api/generate-itinerary', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Error desconocido en el servidor.');
        return;
      }

      renderResults(data.viaje);
    } catch (err) {
      showError('No se pudo conectar con el servidor. Verifica que esté en ejecución.');
    } finally {
      setLoading(false);
    }
  });

  function setLoading(on) {
    document.getElementById('loader').style.display = on ? 'flex' : 'none';
    document.getElementById('submit-btn').disabled = on;
  }

  function showError(msg) {
    const box = document.getElementById('error-box');
    box.textContent = msg;
    box.style.display = 'block';
  }

  function clearError() {
    const box = document.getElementById('error-box');
    box.textContent = '';
    box.style.display = 'none';
  }

  function mapsLink(url, titulo) {
    if (!url) return '';
    return `<a class="maps-link" href="${url}" target="_blank" rel="noopener">
      📍 Ver en Google Maps
    </a>`;
  }

  function momentoClass(m = '') {
    const v = m.toLowerCase();
    if (v.includes('mañana')) return 'manana';
    if (v.includes('tarde'))  return 'tarde';
    if (v.includes('noche'))  return 'noche';
    return '';
  }

  function renderResults(viaje) {
    const container = document.getElementById('results');

    const diasHTML = (viaje.itinerario_diario || []).map(day => {
      const actividades = (day.actividades || []).map(act => `
        <div class="activity">
          <span class="momento ${momentoClass(act.momento)}">${act.momento}</span>
          <div class="activity-content">
            <h4>${act.titulo}</h4>
            <p>${act.descripcion}</p>
            ${mapsLink(act.google_maps_url)}
          </div>
        </div>
      `).join('');

      const lluvia = day.alternativa_lluvia ? `
        <div class="rain-card">
          <span class="rain-icon">🌧️</span>
          <div>
            <h5>Si llueve: ${day.alternativa_lluvia.titulo}</h5>
            <p>${day.alternativa_lluvia.descripcion}</p>
            ${mapsLink(day.alternativa_lluvia.google_maps_url)}
          </div>
        </div>
      ` : '';

      return `
        <div class="day-card open">
          <div class="day-header">
            <span class="day-badge">Día ${day.dia}</span>
            <h3>${day.enfoque}</h3>
            <span class="chevron">▼</span>
          </div>
          <div class="day-body">
            ${actividades}
            ${lluvia}
          </div>
        </div>
      `;
    }).join('');

    const tips = (viaje.consejos_supervivencia || []).map(t => `<li>${t}</li>`).join('');

    container.innerHTML = `
      <div class="results-header">
        <h2>📍 ${viaje.destino}</h2>
        <div class="budget-tip">💡 ${viaje.resumen_presupuesto}</div>
      </div>
      ${diasHTML}
      <div class="tips-card">
        <h3>🧠 Consejos de supervivencia</h3>
        <ul>${tips}</ul>
      </div>
    `;

    container.style.display = 'block';
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
</script>
</body>
</html>
